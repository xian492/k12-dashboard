name: Frontend build

# 纯前端改动的轻量发布：不抓取、不更新信息，直接部署已提交的 docs/ 静态页面。
# 页面重渲染在本地完成：python tools/build.py --offline（用既有快照，无第三方依赖）。
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/frontend-build.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
