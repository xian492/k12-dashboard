name: Build dashboard

# CI 不再抓取：GitHub 托管 runner 在海外，区教委与多数学校站拒境外流量，
# 抓取结果大面积空缺（实测区在线 0/18）。信息抓取只在本地跑
# tools/local_refresh.sh（launchd 定时），产物提交进 docs/ 后由
# frontend-build.yml 部署。此 workflow 仅保留手动触发，作为应急通道：
# 从海外能抓到的（市教委、教育部）仍可用，但区级/学校数据会缺失。
on:
  workflow_dispatch: {}     # 手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-crawl4ai.txt

      - name: Cache Crawl4AI browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/patchright
          key: ${{ runner.os }}-crawl4ai-browsers-${{ hashFiles('requirements-crawl4ai.txt') }}

      - name: Install Crawl4AI
        run: |
          python -m pip install -r requirements-crawl4ai.txt
          crawl4ai-setup

      - name: Community refresh
        continue-on-error: true
        env:
          COMMUNITY_RUN: ${{ runner.temp }}/community-refresh
        run: |
          set +e
          mkdir -p "$COMMUNITY_RUN"
          python community/tools/community_crawler.py \
            --output "$COMMUNITY_RUN/community_beijing.json"
          python community/tools/community_pipeline.py \
            --cap-input "$COMMUNITY_RUN/community_beijing.json" \
            --cap-output "$COMMUNITY_RUN/community_beijing_capped.json"
          python community/tools/community_content_crawler.py \
            --input "$COMMUNITY_RUN/community_beijing_capped.json" \
            --output "$COMMUNITY_RUN/community_beijing_content.jsonl"
          python community/tools/community_content_cleaner.py \
            --input "$COMMUNITY_RUN/community_beijing_content.jsonl" \
            --output "$COMMUNITY_RUN/community_beijing_clean.jsonl" \
            --json-output "$COMMUNITY_RUN/community_beijing_clean.json"
          python community/tools/community_content_enricher.py \
            --input "$COMMUNITY_RUN/community_beijing_clean.jsonl" \
            --output "$COMMUNITY_RUN/community_beijing_enriched.jsonl" \
            --json-output "$COMMUNITY_RUN/community_beijing_enriched.json"
          DETAIL_PAGES=$(python -c 'import json, os; print(len(json.load(open(os.path.join(os.environ["COMMUNITY_RUN"], "community_beijing_capped.json")))))')
          python community/tools/community_pipeline.py \
            --input "$COMMUNITY_RUN/community_beijing_enriched.json" \
            --output docs/community-data.json \
            --status-output docs/community-status.json \
            --entry-pages 6 \
            --detail-pages-attempted "$DETAIL_PAGES"
          exit 0

      - name: Build dashboard
        run: python tools/build.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
